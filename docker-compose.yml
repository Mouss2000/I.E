services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery_worker:
    build:
      context: ./cabinet_backend
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    command: ["celery", "-A", "cabinet_backend.celery:app", "worker", "--loglevel=INFO"]
    environment: &django_environment
      DJANGO_SETTINGS_MODULE: cabinet_backend.settings
      DJANGO_SECRET_KEY_FILE: /run/cabinet/signing-key
      PRIVATE_MEDIA_ROOT: /app/private_media
      EXTERNAL_DELIVERY_ENABLED: "${EXTERNAL_DELIVERY_ENABLED:-0}"
      EMAIL_HOST: "${EMAIL_HOST:-}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-noreply@cabinet2.local}"
      WHATSAPP_SEND_URL: "${WHATSAPP_SEND_URL:-}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: "${POSTGRES_DB:-cabinet}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored root .env or shell}"
    depends_on:
      redis:
        condition: service_healthy

    volumes:
      - ./.runtime:/run/cabinet:ro
      - ./private_media:/app/private_media

  celery_beat:
    build:
      context: ./cabinet_backend
    restart: unless-stopped
    init: true
    command: ["celery", "-A", "cabinet_backend.celery:app", "beat", "--loglevel=INFO", "--schedule=/app/celerybeat/celerybeat-schedule"]
    environment: *django_environment
    volumes:
      - celery_beat_data:/app/celerybeat
      - ./.runtime:/run/cabinet:ro
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  celery_beat_data:
